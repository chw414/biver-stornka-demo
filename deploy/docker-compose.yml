# Uruchomienie: cd deploy && cp .env.example .env && (uzupełnij) && docker compose up -d --build
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: "postgres://serwis_app:${APP_DB_PASSWORD:?ustaw APP_DB_PASSWORD}@db:5432/serwis"
  REDIS_URL: "redis://redis:6379"
  CORS_ORIGIN: "https://${SITE_ADDRESS:?ustaw SITE_ADDRESS}"
  TRUST_PROXY: "1"
  JWT_SECRET: "${JWT_SECRET:?ustaw JWT_SECRET}"
  CSRF_SECRET: "${CSRF_SECRET:?ustaw CSRF_SECRET}"
  BUSINESS_NAME: "${BUSINESS_NAME:-Serwis}"
  BUSINESS_PHONE: "${BUSINESS_PHONE:-}"
  BUSINESS_ADDRESS: "${BUSINESS_ADDRESS:-}"
  WHATSAPP_MODE: "${WHATSAPP_MODE:-log}"
  WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
  WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
  WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
  WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN:-}"
  GOOGLE_CALENDAR_MODE: "${GOOGLE_CALENDAR_MODE:-log}"
  GOOGLE_SERVICE_ACCOUNT_KEY_FILE: "${GOOGLE_SERVICE_ACCOUNT_KEY_FILE:-}"
  GOOGLE_CALENDAR_ID: "${GOOGLE_CALENDAR_ID:-}"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: serwis_owner
      POSTGRES_PASSWORD: "${DB_OWNER_PASSWORD:?ustaw DB_OWNER_PASSWORD}"
      POSTGRES_DB: serwis
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serwis_owner -d serwis"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ../backend
    command: ["node", "dist/scripts/migrate.js"]
    restart: "no"
    logging: *logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: "postgres://serwis_owner:${DB_OWNER_PASSWORD}@db:5432/serwis"
      APP_DB_USER: serwis_app
      APP_DB_PASSWORD: "${APP_DB_PASSWORD}"

  api:
    build: ../backend
    <<: *hardening
    environment:
      <<: *app-env
      PORT: "3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build: ../backend
    <<: *hardening
    command: ["node", "dist/src/worker.js"]
    environment:
      <<: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: ../frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS}"
      ACME_EMAIL: "${ACME_EMAIL:?ustaw ACME_EMAIL}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      db: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: serwis_owner
      PGPASSWORD: "${DB_OWNER_PASSWORD}"
      PGDATABASE: serwis
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_HOUR_UTC: "${BACKUP_HOUR_UTC:-2}"
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name '*.dump' -mmin -1740 | grep -q ."]
      interval: 1h
      timeout: 10s
      start_period: 1h

volumes:
  pgdata:
  caddy_data:
  caddy_config:
